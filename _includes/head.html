<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{% seo %}
{%- if page.url == "/" or page.url == "/zh/" %}
<link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}">
<link rel="alternate" hreflang="zh" href="{{ '/zh/' | absolute_url }}">
{%- endif %}
<link rel="preload" href="{{ '/assets/fonts/newsreader-display.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
{% feed_meta %}
